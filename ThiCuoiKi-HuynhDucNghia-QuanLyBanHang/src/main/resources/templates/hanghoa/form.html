<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${tieuDe} + ' - ElectroStore'">Cập nhật Hàng hóa</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        /* CSS bổ sung riêng cho form nhập liệu */
        .form-select, .form-textarea { width: 100%; padding: 12px 15px; border: 1px solid var(--line); border-radius: 8px; box-sizing: border-box; font-family: inherit; font-size: 14px; transition: all 0.2s; outline: none; }
        .form-select:focus, .form-textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.15); }
        .row-flex { display: flex; gap: 20px; }
        .row-flex .field { flex: 1; }
        .err-msg { color: var(--red); font-size: 13px; display: block; margin-top: 5px; }
    </style>
</head>
<body>
<div class="app-container">

    <aside class="sidebar">
        <div class="brand">
            <span class="logo">⚡</span>
            <div>
                <h1>ElectroStore</h1>
                <p>Hệ thống Quản trị</p>
            </div>
        </div>
        <nav class="sidebar-menu">
            <a th:href="@{/}">📊 Bảng điều khiển</a>
            <a th:href="@{/loaihang}">🏷️ Quản lý Loại hàng</a>
            <a class="active" th:href="@{/hanghoa}">📦 Quản lý Hàng hóa</a>
            <a th:href="@{/hoadon}">🧾 Quản lý Hóa đơn</a>
        </nav>
    </aside>

    <main class="main-content">
        
        <header class="topbar">
            <h2 class="page-title" th:text="${tieuDe}">Biểu mẫu Hàng hóa</h2>
            <a class="btn btn-ghost" th:href="@{/hanghoa}">&larr; Quay lại danh sách</a>
        </header>

        <div class="panel" style="max-width: 700px; margin: 0 auto; padding: 30px;">
            <h3 style="margin: -30px -30px 25px -30px; font-size: 18px;">🛒 Thông tin sản phẩm</h3>
            
            <form method="post" th:action="@{/hanghoa/luu}" th:object="${hangHoa}">
                <input type="hidden" th:field="*{maHangHoa}">

                <div class="field">
                    <label>Tên hàng hóa <span style="color:red">*</span></label>
                    <input type="text" th:field="*{tenHangHoa}" placeholder="VD: Laptop Lenovo Lecoo Pro 14" required>
                    <span class="err-msg" th:if="${#fields.hasErrors('tenHangHoa')}" th:errors="*{tenHangHoa}"></span>
                </div>

                <div class="field">
                    <label>Loại hàng <span style="color:red">*</span></label>
                    <select class="form-select" th:field="*{loaiHang}" required>
                        <option th:value="null">-- Vui lòng chọn danh mục --</option>
                        <option th:each="l : ${dsLoai}" th:value="${l.maLoaiHang}" th:text="${l.tenLoaiHang}"></option>
                    </select>
                    <span class="err-msg" th:if="${#fields.hasErrors('loaiHang')}" th:errors="*{loaiHang}"></span>
                </div>

                <div class="row-flex">
                    <div class="field">
                        <label>Đơn giá (VNĐ) <span style="color:red">*</span></label>
                        <input type="number" step="1000" min="0" th:field="*{donGia}" placeholder="Ví dụ: 15000000" required>
                        <span class="err-msg" th:if="${#fields.hasErrors('donGia')}" th:errors="*{donGia}"></span>
                    </div>
                    <div class="field">
                        <label>Số lượng tồn kho <span style="color:red">*</span></label>
                        <input type="number" min="0" th:field="*{soLuongTon}" placeholder="Ví dụ: 50" required>
                        <span class="err-msg" th:if="${#fields.hasErrors('soLuongTon')}" th:errors="*{soLuongTon}"></span>
                    </div>
                </div>

                <div class="field">
                    <label>Mô tả sản phẩm</label>
                    <textarea class="form-textarea" rows="4" th:field="*{moTa}" placeholder="Nhập cấu hình, màu sắc, tình trạng..."></textarea>
                </div>

                <div style="display: flex; gap: 15px; margin-top: 30px;">
                    <button class="btn" style="background: var(--primary); color: white; flex: 1; padding: 12px; font-size: 15px;" type="submit">💾 Lưu dữ liệu</button>
                    <a class="btn btn-ghost" style="padding: 12px 25px; font-size: 15px;" th:href="@{/hanghoa}">Hủy bỏ</a>
                </div>
            </form>
        </div>

        <footer class="foot">Huỳnh Đức Nghĩa &mdash; Đồ án Spring Boot + SQL Server</footer>
    </main>
</div>
</body>
</html>
