<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${tieuDe} + ' - ElectroStore'"></title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .form-control, .form-select { width: 100%; padding: 12px 15px; border: 1px solid var(--line); border-radius: 8px; box-sizing: border-box; font-family: inherit; font-size: 14px; outline: none; transition: 0.2s; }
        .form-control:focus, .form-select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.15); }
        .field { margin-bottom: 20px; }
        .field label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 14px; color: var(--text-main); }
    </style>
</head>
<body>
<div class="app-container">
    <aside th:replace="~{fragments/sidebar :: sidebar('nhanvien')}"></aside>

    <main class="main-content">
        <header class="topbar">
            <h2 class="page-title" th:text="${tieuDe}">Biểu mẫu hồ sơ</h2>
            <a class="btn btn-ghost" th:href="@{/nhanvien}">&larr; Quay lại danh sách</a>
        </header>

        <div class="panel" style="max-width: 600px; margin: 0 auto; padding: 30px;">
            <h3 style="margin: -30px -30px 25px -30px; font-size: 18px;">👥 Hồ sơ tài khoản nhân viên</h3>
            
            <form method="post" th:action="@{/nhanvien/luu}" th:object="${nhanVien}">
                <input type="hidden" th:field="*{maNguoiDung}">
                <input type="hidden" th:field="*{ngayTao}">

                <div class="field">
                    <label>Họ và Tên nhân viên <span style="color:red">*</span></label>
                    <input type="text" class="form-control" th:field="*{hoTen}" placeholder="VD: Nguyễn Văn A" required>
                </div>

                <div class="field">
                    <label>Tên đăng nhập hệ thống <span style="color:red">*</span></label>
                    <input type="text" class="form-control" th:field="*{tenDangNhap}" placeholder="VD: nv_annguyen" required th:readonly="${maNguoiDung != null}">
                </div>

                <div class="field">
                    <label>Mật khẩu <span style="color:red">*</span></label>
                    <input type="text" class="form-control" th:field="*{matKhau}" placeholder="Nhập mật khẩu mặc định (VD: 1)" required>
                </div>

                <div class="field">
                    <label>Vai trò phân quyền <span style="color:red">*</span></label>
                    <select class="form-select" th:field="*{vaiTro}" required>
                        <option value="NhanVien">Nhân viên bán hàng (NhanVien)</option>
                        <option value="Admin">Quản trị viên tối cao (Admin)</option>
                    </select>
                </div>

                <div style="display: flex; gap: 15px; margin-top: 30px;">
                    <button class="btn" style="background: var(--primary); color: white; flex: 1; padding: 12px; font-size: 15px;" type="submit">💾 Lưu tài khoản</button>
                    <a class="btn btn-ghost" style="padding: 12px 25px; font-size: 15px;" th:href="@{/nhanvien}">Hủy bỏ</a>
                </div>
            </form>
        </div>
        <footer class="foot">Huỳnh Đức Nghĩa &mdash; Đồ án Spring Boot + SQL Server</footer>
    </main>
</div>
</body>
</html>
