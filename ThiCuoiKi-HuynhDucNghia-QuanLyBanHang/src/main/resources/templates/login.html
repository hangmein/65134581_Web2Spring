<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - ElectroStore</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="login-wrap">
    <div class="login-card">
        <div class="login-logo">⚡</div>
        <h1>ElectroStore</h1>
        <p class="sub">Hệ thống Quản trị Bán hàng</p>

        <p class="err-box" th:if="${loi}" th:text="${loi}"></p>

        <form method="post" th:action="@{/login}">
            <div class="field">
                <label>Tên đăng nhập</label>
                <input type="text" name="tenDangNhap" required autofocus placeholder="Ví dụ: admin">
            </div>
            <div class="field">
                <label>Mật khẩu</label>
                <input type="password" name="matKhau" required placeholder="••••••">
            </div>
            <button class="btn btn-block" type="submit">Đăng nhập ngay</button>
        </form>
        
        <p class="hint">💡 Tài khoản mẫu: admin / 1</p>
    </div>
</div>
</body>
</html>
