<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chi tiet hoa don</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="wrap">
    <header class="topbar">
        <div class="brand"><span class="logo">⚡</span>
            <div><h1 th:text="'Hoa don #' + ${hoaDon.maHoaDon}">Hoa don</h1>
                 <p th:text="${#temporals.format(hoaDon.ngayLap, 'dd/MM/yyyy HH:mm')}">--</p></div>
        </div>
        <a class="btn btn-ghost" th:href="@{/hoadon}">&larr; Danh sach</a>
    </header>

    <p class="err-box" th:if="${thanhCong}" th:text="${thanhCong}"
       style="background:rgba(46,204,143,.12);border-color:rgba(46,204,143,.4);color:var(--green)"></p>

    <div class="form-card" style="margin-bottom:18px">
        <div class="row">
            <div><span class="muted">Khach hang:</span> <span class="bold" th:text="${hoaDon.tenKhachHang}">--</span></div>
            <div><span class="muted">SDT:</span> <span class="bold" th:text="${hoaDon.soDienThoai}">--</span></div>
        </div>
        <div style="margin-top:10px"><span class="muted">Nhan vien lap:</span>
            <span class="bold" th:text="${hoaDon.nguoiDung != null ? hoaDon.nguoiDung.hoTen : ''}">--</span></div>
    </div>

    <div class="table-card">
        <table>
            <thead>
            <tr><th>San pham</th><th class="right">Don gia</th><th class="right">SL</th><th class="right">Thanh tien</th></tr>
            </thead>
            <tbody>
            <tr th:if="${hoaDon.chiTiet.isEmpty()}"><td colspan="4" class="empty">Khong co san pham.</td></tr>
            <tr th:each="ct : ${hoaDon.chiTiet}">
                <td class="bold" th:text="${ct.hangHoa.tenHangHoa}">SP</td>
                <td class="right" th:text="${#numbers.formatDecimal(ct.donGia, 0, 'COMMA', 0, 'POINT')}">0</td>
                <td class="right" th:text="${ct.soLuong}">0</td>
                <td class="right" th:text="${#numbers.formatDecimal(ct.thanhTien, 0, 'COMMA', 0, 'POINT')}">0</td>
            </tr>
            </tbody>
            <tfoot>
            <tr>
                <td colspan="3" class="right bold">TONG TIEN</td>
                <td class="right bold" style="color:var(--primary)"
                    th:text="${#numbers.formatDecimal(hoaDon.tongTien, 0, 'COMMA', 0, 'POINT')} + ' d'">0</td>
            </tr>
            </tfoot>
        </table>
    </div>

    <div class="form-actions" style="margin-top:18px">
        <a class="btn btn-primary" th:href="@{/hoadon/them}">+ Lap phieu moi</a>
        <a class="btn btn-del" th:href="@{/hoadon/xoa/{id}(id=${hoaDon.maHoaDon})}"
           onclick="return confirm('Xoa hoa don nay? (so luong se duoc hoan lai kho)');">Xoa hoa don</a>
    </div>
</div>
</body>
</html>
