<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lap hoa don</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .picker { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; margin-bottom: 18px; }
        .picker .field { margin: 0; flex: 1; min-width: 200px; }
        .section-title { font-size: 15px; margin: 22px 0 12px; color: var(--text); }
    </style>
</head>
<body>
<div class="wrap">
    <header class="topbar">
        <div class="brand"><span class="logo">⚡</span><h1>Lap hoa don</h1></div>
        <a class="btn btn-ghost" th:href="@{/hoadon}">&larr; Quay lai</a>
    </header>

    <p class="err-box" th:if="${loi}" th:text="${loi}"></p>

    <form method="post" th:action="@{/hoadon/luu}" id="phieuForm" onsubmit="return kiemTra()">
        <!-- Thong tin khach hang -->
        <div class="form-card" style="margin-bottom:18px">
            <h3 class="section-title" style="margin-top:0">Thong tin khach hang</h3>
            <div class="row">
                <div class="field">
                    <label>Ten khach hang</label>
                    <input type="text" name="tenKhachHang" placeholder="VD: Le Van C">
                </div>
                <div class="field">
                    <label>So dien thoai</label>
                    <input type="text" name="soDienThoai" placeholder="09xxxxxxxx">
                </div>
            </div>
        </div>

        <!-- Chon san pham -->
        <div class="form-card">
            <h3 class="section-title" style="margin-top:0">San pham</h3>
            <div class="picker">
                <div class="field">
                    <label>Chon san pham</label>
                    <select id="spSelect">
                        <option value="">-- Chon san pham --</option>
                        <option th:each="hh : ${dsHangHoa}" th:value="${hh.maHangHoa}"
                                th:attr="data-gia=${hh.donGia}, data-ton=${hh.soLuongTon}, data-ten=${hh.tenHangHoa}"
                                th:text="${hh.tenHangHoa} + ' - ' + ${#numbers.formatDecimal(hh.donGia,0,'COMMA',0,'POINT')} + ' d (ton: ' + ${hh.soLuongTon} + ')'"></option>
                    </select>
                </div>
                <div class="field" style="flex:0 0 120px">
                    <label>So luong</label>
                    <input type="number" id="slInput" value="1" min="1">
                </div>
                <button type="button" class="btn btn-dark" onclick="themVaoGio()">Them vao phieu</button>
            </div>

            <div class="table-card">
                <table>
                    <thead>
                    <tr><th>San pham</th><th class="right">Don gia</th><th class="right">SL</th>
                        <th class="right">Thanh tien</th><th class="center">Xoa</th></tr>
                    </thead>
                    <tbody id="gioBody"></tbody>
                    <tfoot>
                    <tr>
                        <td colspan="3" class="right bold">TONG TIEN</td>
                        <td class="right bold" style="color:var(--primary)" id="tongTien">0 d</td>
                        <td></td>
                    </tr>
                    </tfoot>
                </table>
            </div>

            <!-- noi chua input an gui len server -->
            <div id="hiddenInputs"></div>

            <div class="form-actions" style="margin-top:18px">
                <button class="btn btn-primary" type="submit">Xac nhan lap phieu</button>
                <a class="btn btn-ghost" th:href="@{/hoadon}">Huy</a>
            </div>
        </div>
    </form>
</div>

<script>
    const cart = [];

    function themVaoGio() {
        const sel = document.getElementById('spSelect');
        if (!sel.value) { alert('Vui long chon san pham'); return; }
        const opt = sel.options[sel.selectedIndex];
        const id  = parseInt(sel.value);
        const ten = opt.getAttribute('data-ten');
        const gia = parseFloat(opt.getAttribute('data-gia'));
        const ton = parseInt(opt.getAttribute('data-ton'));
        const sl  = parseInt(document.getElementById('slInput').value);

        if (!sl || sl <= 0) { alert('So luong khong hop le'); return; }
        const daCo = cart.filter(c => c.id === id).reduce((s, c) => s + c.sl, 0);
        if (daCo + sl > ton) { alert('Vuot ton kho! Con lai: ' + (ton - daCo)); return; }

        const existing = cart.find(c => c.id === id);
        if (existing) existing.sl += sl; else cart.push({ id, ten, gia, sl });
        render();
    }

    function xoa(i) { cart.splice(i, 1); render(); }

    function render() {
        const body = document.getElementById('gioBody');
        const hidden = document.getElementById('hiddenInputs');
        body.innerHTML = '';
        hidden.innerHTML = '';
        let tong = 0;
        cart.forEach((c, i) => {
            const tt = c.gia * c.sl;
            tong += tt;
            body.innerHTML +=
                '<tr><td class="bold">' + c.ten + '</td>' +
                '<td class="right">' + c.gia.toLocaleString('vi-VN') + '</td>' +
                '<td class="right">' + c.sl + '</td>' +
                '<td class="right">' + tt.toLocaleString('vi-VN') + '</td>' +
                '<td class="center"><button type="button" class="btn btn-sm btn-del" onclick="xoa(' + i + ')">Xoa</button></td></tr>';
            hidden.innerHTML +=
                '<input type="hidden" name="maHangHoa" value="' + c.id + '">' +
                '<input type="hidden" name="soLuong" value="' + c.sl + '">';
        });
        if (cart.length === 0)
            body.innerHTML = '<tr><td colspan="5" class="empty">Chua co san pham trong phieu.</td></tr>';
        document.getElementById('tongTien').textContent = tong.toLocaleString('vi-VN') + ' d';
    }

    function kiemTra() {
        if (cart.length === 0) { alert('Phieu phai co it nhat 1 san pham'); return false; }
        return true;
    }

    document.addEventListener('DOMContentLoaded', render);
</script>
</body>
</html>
