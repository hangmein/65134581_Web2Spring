<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${tieuDe}">Loai hang</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="wrap narrow">
    <header class="topbar">
        <div class="brand"><span class="logo">⚡</span><h1 th:text="${tieuDe}">Form</h1></div>
        <a class="btn btn-ghost" th:href="@{/loaihang}">&larr; Quay lai</a>
    </header>

    <div class="form-card">
        <form method="post" th:action="@{/loaihang/luu}" th:object="${loaiHang}">
            <input type="hidden" th:field="*{maLoaiHang}">
            <div class="field">
                <label>Ten loai hang</label>
                <input type="text" th:field="*{tenLoaiHang}" placeholder="VD: Dien thoai">
                <span class="err" th:if="${#fields.hasErrors('tenLoaiHang')}" th:errors="*{tenLoaiHang}"></span>
            </div>
            <div class="field">
                <label>Mo ta</label>
                <textarea rows="3" th:field="*{moTa}"></textarea>
            </div>
            <div class="form-actions">
                <button class="btn btn-primary" type="submit">Luu</button>
                <a class="btn btn-ghost" th:href="@{/loaihang}">Huy</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
