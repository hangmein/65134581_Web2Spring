<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loai hang</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="wrap">
    <header class="topbar">
        <div class="brand"><span class="logo">⚡</span><h1>Loai hang</h1></div>
        <a class="btn btn-primary" th:href="@{/loaihang/them}">+ Them loai hang</a>
    </header>
    <nav class="menu">
        <a th:href="@{/}">Trang chu</a>
        <a class="active" th:href="@{/loaihang}">Loai hang</a>
        <a th:href="@{/hanghoa}">Hang hoa</a>
        <a th:href="@{/hoadon}">Hoa don</a>
    </nav>

    <div class="table-card">
        <table>
            <thead><tr><th>ID</th><th>Ten loai</th><th>Mo ta</th><th class="center">Thao tac</th></tr></thead>
            <tbody>
            <tr th:if="${danhSach.isEmpty()}"><td colspan="4" class="empty">Chua co loai hang.</td></tr>
            <tr th:each="lh : ${danhSach}">
                <td th:text="${lh.maLoaiHang}">1</td>
                <td class="bold" th:text="${lh.tenLoaiHang}">Ten</td>
                <td class="muted" th:text="${lh.moTa}">Mo ta</td>
                <td class="center actions">
                    <a class="btn btn-sm btn-edit" th:href="@{/loaihang/sua/{id}(id=${lh.maLoaiHang})}">Sua</a>
                    <a class="btn btn-sm btn-del" th:href="@{/loaihang/xoa/{id}(id=${lh.maLoaiHang})}"
                       onclick="return confirm('Xoa loai hang nay?');">Xoa</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
