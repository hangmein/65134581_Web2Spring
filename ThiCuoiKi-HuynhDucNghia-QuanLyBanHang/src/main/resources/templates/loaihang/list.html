<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Danh mục - ElectroStore</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="app-container">

    <aside th:replace="~{fragments/sidebar :: sidebar('loaihang')}"></aside>
    <main class="main-content">
        
        <header class="topbar">
            <h2 class="page-title">Danh sách Phân loại Hàng hóa</h2>
            <div class="user-box">
                <span th:if="${session.user != null}" th:text="'👋 Xin chào, ' + ${session.user.hoTen}">User</span>
                <a class="btn btn-ghost" th:href="@{/logout}">Đăng xuất</a>
            </div>
        </header>

        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px;">
            <form method="get" th:action="@{/loaihang}" style="display: flex; gap: 10px; align-items: center;">
                <input type="text" name="keyword" th:value="${keyword}" placeholder="🔍 Tìm theo tên loại..." style="padding: 10px 15px; border: 1px solid var(--line); border-radius: 8px; width: 250px; outline: none;">
                <button class="btn" style="background: var(--text-main); color: white;" type="submit">Tìm kiếm</button>
                <a class="btn btn-ghost" th:href="@{/loaihang}">Xóa lọc</a>
            </form>

            <a class="btn" style="background: var(--primary); color: white; padding: 10px 20px;" th:href="@{/loaihang/them}">+ Thêm Danh mục mới</a>
        </div>

        <div class="panel">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Tên phân loại</th>
                        <th>Mô tả chi tiết</th>
                        <th class="center">Thao tác</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${#lists.isEmpty(danhSach)}">
                        <td colspan="4" class="empty">Không tìm thấy danh mục nào phù hợp.</td>
                    </tr>
                    <tr th:each="lh : ${danhSach}">
                        <td th:text="${lh.maLoaiHang}">1</td>
                        <td class="bold" th:text="${lh.tenLoaiHang}">Tên</td>
                        <td style="color: var(--text-muted);" th:text="${lh.moTa}">Mô tả</td>
                        <td class="center">
                            <a class="btn btn-sm btn-edit" th:href="@{/loaihang/sua/{id}(id=${lh.maLoaiHang})}">Sửa</a>
                            <a class="btn btn-sm" style="background: #fce4e4; color: var(--red); padding: 6px 12px; font-size: 13px;" th:href="@{/loaihang/xoa/{id}(id=${lh.maLoaiHang})}" onclick="return confirm('Bạn có chắc chắn muốn xóa danh mục này?');">Xóa</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <footer class="foot">Huỳnh Đức Nghĩa &mdash; Đồ án Spring Boot + SQL Server</footer>
    </main>
</div>
</body>
</html>
